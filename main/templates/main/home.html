{% extends 'main/main.html' %}

{% block title %}
    Kitchen
{% endblock %}

{% block page %}
    <span class="name-page"> Products </span>
{% endblock %}

{% block main %}
    {% for product in products %}
        <a href="" class="main-product">
            <img class="read-img" src="{{product.image.url}}" >
            <div class="read-container">
                <div class="read-name">{{product.name}}</div>
                <div class="read-price">
                    {{product.price}}&nbsp;
                    <span style="font-size: clamp(8px, 1vw, 35px); color: burlywood">
                        Sh
                    </span>
                </div>
                <div class="read-min_desc">{{product.min_desc}}</div>
            </div>
        </a>
            <span>&nbsp;</span>
    {% endfor %}
{% endblock %}
