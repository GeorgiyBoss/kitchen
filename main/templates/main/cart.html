{% extends 'main/main.html' %}

{% block title %}
    CART
{% endblock %}

{% block page %}
    <span class="name-page"> Your cart </span>
{% endblock %}

{% block main %}
    <table>
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
        </tr>
        {% for item in products %}
        <tr>
            <td>{{ item.product.name }}</td>
            <td>{{ item.product.price }}</td>
            <td>{{ item.quantity }}</td>
            <td>{{ item.total }}</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
